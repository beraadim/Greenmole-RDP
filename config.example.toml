# Greenmole RDP server configuration
# Copy this file to config.toml and modify as needed.
# Config search order: ./config.toml → ~/.config/macrdp/ → ~/Library/Application Support/macrdp/

# ─── Network ───────────────────────────────────────────────────────────────────

# TCP port to listen on
# Default: 3389 (standard RDP port, may require sudo)
# Options: any valid port number (1024-65535 recommended)
port = 13389

# ─── Authentication ────────────────────────────────────────────────────────────

# RDP login credentials (NLA/Hybrid/CredSSP)
# Set both fields for unattended startup; use a unique password and protect this file.
# Omitting both is supported only in an interactive terminal, which displays
# generated one-time credentials. Empty/partial credentials are rejected.
username = "admin"
password = "" # Replace before use. No working default password is shipped.

# ─── Display ───────────────────────────────────────────────────────────────────

# "main" shares the main display. "virtual" creates an experimental extended
# display in the same macOS session and gathers existing windows when connected.
# Disconnect restores the physical arrangement and removes the virtual display.
# Changes require a server restart; ordinary client resizing does not.
display_backend = "main"

# Experimental: keep the display allocated but disabled between remote sessions.
# Requires display_backend="virtual" and a service restart. Default: false.
# Created on the first connection; capture/encoding stop while disconnected.
# The owning helper and display are removed when the server stops.
reuse_virtual_display = false

# Opt-in guarded control of a virtual desktop. Requires display_backend="virtual"
# and macOS permission to install an active input tap. Changing this needs restart.
# Hides local screens and blocks local input; failures lock the Mac. See
# docs/private-sessions.md for recovery, permission and security limitations.
private_session = false

# Resolution width in pixels
# Default: 0 (auto-detect from macOS display + follow client request)
# Set to a specific value (e.g. 1920) to force a fixed resolution
width = 0

# Resolution height in pixels
# Default: 0 (auto-detect from macOS display + follow client request)
# Set to a specific value (e.g. 1080) to force a fixed resolution
height = 0

# Target frame rate
# Default: 60
# Options: 30, 60, 120
frame_rate = 60

# Target bitrate in Mbps (default: auto-calculated from resolution/fps/quality)
# Override this to force a specific bitrate. Adaptive quality will still adjust
# within this ceiling based on network conditions.
# bitrate_mbps = 50

# Remote framebuffer resolution: "auto" or "WIDTHxHEIGHT" in pixels.
# "auto" follows the selected screen and client request. Virtual displays support
# up to 3840x2160; changing this setting for a virtual display requires a restart.
# resolution = "3840x2160"

# ─── Keyboard ──────────────────────────────────────────────────────────────────

# Text layout uses the RDP client's negotiated layout, independently of shortcuts.
# Options: auto, us, uk, no, se, dk, de, fr, physical. Restart required.
# The existing Norwegian Windows mapping is preserved. Greenmole browser sessions
# normally use a US transport layout even with a Norwegian local keyboard.
# Unsupported layouts and "physical" use the Mac's selected input source.
keyboard_layout = "auto"

# Shortcut policy. Restart required.
# auto: honor a supported Greenmole client preference, otherwise Windows-friendly.
# windows: preserve Ctrl+A/X/C/V/Enter -> Command and Alt -> Command, Win -> Option.
# mac: preserve native Command/Option/Control, including Control+C in Terminal.
# physical: keep Control; map Win/Super to Command and Alt to Option.
keyboard_shortcuts = "auto"

# ─── Encoding ──────────────────────────────────────────────────────────────────

# Image quality preset (CLI default: high_quality; desktop default: balanced).
# Desktop quality and encoder controls apply while the service is running.
# CLI configuration files are read at startup. Switching back from images to
# browser AVC420 may require reconnecting the client; the service can stay up.
# Options:
#   "low_latency"  — faster video encoding and smaller RemoteFX updates
#   "balanced"     — moderate video detail; standard RemoteFX quantization
#   "high_quality" — sharper video and RemoteFX; higher bandwidth/encoding cost
#   "lossless"     — exact captured RGB bitmap compression; bypasses video/RemoteFX
# Guacamole can add lossy browser-side compression independently. Enable its
# force-lossless connection option when comparing pixel fidelity.
quality = "high_quality"

# Graphics encoder selection
# Default: software
# Options:
#   "software"  — OpenH264 video encoding
#   "hardware"  — VideoToolbox hardware video encoding, requires macOS
#   "auto"      — same as software
#   "bitmap"    — classic bitmap updates; compression follows the quality preset
encoder = "hardware"

# Chroma subsampling mode
# Default: avc420
# Options:
#   "avc420" — standard YUV 4:2:0 (compatible with all RDP clients)
#   "avc444" — full YUV 4:4:4 via dual-stream AVC444 (requires V10+ client, best quality)
# chroma_mode = "avc420"

# ─── TLS ───────────────────────────────────────────────────────────────────────

# Path to TLS certificate file (PEM format)
# Supply both custom paths or neither. Existing custom files are validated and
# never replaced; otherwise the application manages a self-signed certificate.
# cert_path = "/path/to/cert.pem"

# Path to TLS private key file (PEM format)
# Custom private keys must match the certificate.
# key_path = "/path/to/key.pem"

# Additional hostnames/IPs used by clients. Requires a service restart.
# Managed certificates also include localhost and the Mac hostname; changing names
# renews the managed identity and may cause a new client trust prompt.
# With custom paths, each supplied name must be covered by the certificate SANs.
# tls_server_names = ["mac-mini.local", "192.0.2.10"]

# ─── Logging ───────────────────────────────────────────────────────────────────

# Log level
# Default: info
# Options: trace, debug, info, warn, error
log_level = "info"

# ─── Session ───────────────────────────────────────────────────────────────────

# Idle timeout in seconds (disconnect after no input)
# Default: 1800 (30 minutes)
idle_timeout_secs = 1800

# Audio and clipboard policies take effect after restarting the service.
[audio]
enabled = true
sample_rate = 48000
channels = 2

[clipboard]
enabled = true
file_transfer = true
# Binary MiB, from 1 to 256. Incoming batches also have a 256 MiB total limit.
max_file_size_mb = 100

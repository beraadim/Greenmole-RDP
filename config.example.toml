# macrdp server configuration
# Copy this file to config.toml and modify as needed.
# Config search order: ./config.toml → ~/.config/macrdp/ → ~/Library/Application Support/macrdp/

# ─── Network ───────────────────────────────────────────────────────────────────

# TCP port to listen on
# Default: 3389 (standard RDP port, may require sudo)
# Options: any valid port number (1024-65535 recommended)
port = 13389

# ─── Authentication ────────────────────────────────────────────────────────────

# RDP login credentials (NLA/Hybrid/CredSSP)
# Set both fields for unattended startup; use a unique password and protect this file.
# Omitting both is supported only in an interactive terminal, which displays
# generated one-time credentials. Empty/partial credentials are rejected.
username = "admin"
password = "" # Replace before use. No working default password is shipped.

# ─── Display ───────────────────────────────────────────────────────────────────

# "main" shares the main display. "virtual" creates an experimental extended
# display in the same macOS session; move windows onto it to use them remotely.
# The virtual display remains available until the server stops.
# Changes require a server restart; ordinary client resizing does not.
display_backend = "main"

# Resolution width in pixels
# Default: 0 (auto-detect from macOS display + follow client request)
# Set to a specific value (e.g. 1920) to force a fixed resolution
width = 0

# Resolution height in pixels
# Default: 0 (auto-detect from macOS display + follow client request)
# Set to a specific value (e.g. 1080) to force a fixed resolution
height = 0

# Target frame rate
# Default: 60
# Options: 30, 60, 120
frame_rate = 60

# Target bitrate in Mbps (default: auto-calculated from resolution/fps/quality)
# Override this to force a specific bitrate. Adaptive quality will still adjust
# within this ceiling based on network conditions.
# bitrate_mbps = 50

# Remote framebuffer resolution: "auto" or "WIDTHxHEIGHT" in pixels.
# "auto" follows the selected screen and client request. Virtual displays support
# up to 3840x2160; changing this setting for a virtual display requires a restart.
# resolution = "3840x2160"

# ─── Encoding ──────────────────────────────────────────────────────────────────

# Video quality preset
# Default: high_quality
# Options:
#   "low_latency"  — lower bitrate, fastest encoding (~16 Mbps @ 1080p30)
#   "balanced"     — moderate quality and bitrate (~33 Mbps @ 1080p30)
#   "high_quality" — best visual quality, higher bitrate (~50 Mbps @ 1080p30)
quality = "high_quality"

# H.264 encoder selection
# Default: software
# Options:
#   "software"  — OpenH264 (CPU), full P-frame support, ~40ms encode latency
#   "hardware"  — VideoToolbox (GPU), ~6ms encode latency, requires macOS
#   "auto"      — same as software
encoder = "hardware"

# Chroma subsampling mode
# Default: avc420
# Options:
#   "avc420" — standard YUV 4:2:0 (compatible with all RDP clients)
#   "avc444" — full YUV 4:4:4 via dual-stream AVC444 (requires V10+ client, best quality)
# chroma_mode = "avc420"

# ─── TLS ───────────────────────────────────────────────────────────────────────

# Path to TLS certificate file (PEM format)
# Supply both custom paths or neither. Existing custom files are validated and
# never replaced; otherwise the application manages a self-signed certificate.
# cert_path = "/path/to/cert.pem"

# Path to TLS private key file (PEM format)
# Custom private keys must match the certificate.
# key_path = "/path/to/key.pem"

# Additional hostnames/IPs used by clients. Requires a service restart.
# Managed certificates also include localhost and the Mac hostname; changing names
# renews the managed identity and may cause a new client trust prompt.
# With custom paths, each supplied name must be covered by the certificate SANs.
# tls_server_names = ["mac-mini.local", "192.0.2.10"]

# ─── Logging ───────────────────────────────────────────────────────────────────

# Log level
# Default: info
# Options: trace, debug, info, warn, error
log_level = "info"

# ─── Session ───────────────────────────────────────────────────────────────────

# Idle timeout in seconds (disconnect after no input)
# Default: 1800 (30 minutes)
idle_timeout_secs = 1800

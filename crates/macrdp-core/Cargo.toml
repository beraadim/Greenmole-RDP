[package]
name = "macrdp-core"
version = "0.1.27"
edition.workspace = true

[dependencies]
macrdp-display = { path = "../macrdp-display" }
macrdp-capture = { path = "../macrdp-capture" }
macrdp-input = { path = "../macrdp-input" }
macrdp-privacy = { path = "../macrdp-privacy" }
macrdp-encode = { path = "../macrdp-encode" }
macrdp-audio = { path = "../macrdp-audio" }
macrdp-clipboard = { path = "../macrdp-clipboard" }
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
anyhow.workspace = true
bytes.workspace = true
time.workspace = true
ironrdp-server = { version = "0.10", features = ["helper"] }
ironrdp-displaycontrol = "0.5"
async-trait = "0.1"
chrono = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
rcgen = "0.13"
x509-cert = { version = "0.2.5", features = ["pem"] }
ring = "0.17"
dirs = "6"
getrandom = "0.2"
tempfile = "3"

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "3"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"

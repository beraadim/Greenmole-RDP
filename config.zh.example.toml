# Greenmole RDP server configuration (legacy example filename)
# Copy this file to config.toml and modify as needed.
# Config search order: ./config.toml → ~/.config/macrdp/ → ~/Library/Application Support/macrdp/

# ─── Network ───────────────────────────────────────────────────────────────────

# TCP port to listen on
# Default: 3389 (standard RDP port; ports below 1024 require elevated privileges)
# Options: any valid port number (1024-65535 recommended)
port = 13389

# ─── Authentication ────────────────────────────────────────────────────────────

# RDP login credentials (NLA/Hybrid/CredSSP authentication)
# Set both fields for unattended startup; use a unique password and protect this file.
# Omit both only in an interactive terminal to generate one-time credentials.
# Empty or partial credentials are rejected.
username = "admin"
password = "" # Replace before use. No working default password is shipped.

# ─── Display ───────────────────────────────────────────────────────────────────

# "main" shares the main display; "virtual" creates an experimental extended
# display in the current macOS session.
# Connection gathers existing windows. Disconnect restores the physical display
# arrangement and removes the virtual display.
# Changes require a server restart; ordinary client resizing does not.
display_backend = "main"

# Experimental: keep the display allocated but disabled between remote sessions.
# Requires display_backend="virtual" and a service restart. Default: false.
# Created on the first connection; capture and encoding stop while disconnected.
# The owning helper and display are removed when the server stops.
reuse_virtual_display = false

# Resolution width in pixels
# Default: 0 (auto-detect from the macOS display and follow client requests)
# Set a specific value (e.g. 1920) to force a fixed resolution and ignore client requests.
width = 0

# Resolution height in pixels
# Default: 0 (auto-detect from the macOS display and follow client requests)
# Set a specific value (e.g. 1080) to force a fixed resolution and ignore client requests.
height = 0

# Target frame rate
# Default: 60
# Options: 30, 60, 120
frame_rate = 60

# Target bitrate in Mbps (default: auto-calculated from resolution, frame rate and quality)
# When overridden, adaptive quality still adjusts within this ceiling for network conditions.
# bitrate_mbps = 50

# Remote framebuffer resolution: "auto" or "WIDTHxHEIGHT" in pixels.
# "auto" follows the selected display and client request. Virtual displays support
# up to 3840x2160. Changing this setting for a virtual display requires a server restart.
# resolution = "3840x2160"

# ─── Encoding ──────────────────────────────────────────────────────────────────

# Video quality preset
# Default: high_quality
# Options:
#   "low_latency"  — low bitrate, fastest encoding (about 16 Mbps at 1080p30)
#   "balanced"     — balances detail and bitrate (about 33 Mbps at 1080p30)
#   "high_quality" — highest detail, higher bitrate (about 50 Mbps at 1080p30)
quality = "high_quality"

# H.264 encoder selection
# Default: software
# Options:
#   "software"  — OpenH264 software encoding (CPU), supports P-frames
#   "hardware"  — VideoToolbox hardware encoding (GPU), macOS only
#   "auto"      — same as software
encoder = "hardware"

# Chroma subsampling mode
# Default: avc420
# Options:
#   "avc420" — standard YUV 4:2:0 chroma subsampling
#   "avc444" — full YUV 4:4:4 via dual-stream AVC444 (requires a V10+ client)
# chroma_mode = "avc420"

# ─── TLS certificates ───────────────────────────────────────────────────────────

# Path to the TLS certificate file (PEM format)
# Default: automatically generate a self-signed certificate
# cert_path = "/path/to/cert.pem"

# Path to the TLS private key file (PEM format)
# Default: generate the private key together with the certificate
# key_path = "/path/to/key.pem"

# ─── Logging ───────────────────────────────────────────────────────────────────

# Log level
# Default: info
# Options: trace, debug, info, warn, error
log_level = "info"

# ─── Session ───────────────────────────────────────────────────────────────────

# Idle timeout in seconds; disconnect after this period without input
# Default: 1800 (30 minutes)
idle_timeout_secs = 1800

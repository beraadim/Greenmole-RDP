name: Verify and Release

on:
  pull_request:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secrets:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: "false"
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"

  build-macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: aarch64
          - runner: macos-15-intel
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Install pinned Rust toolchain
        run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
        with:
          workspaces: |
            .
            macrdp-ui/src-tauri
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: macrdp-ui/package-lock.json
      - name: Install frontend dependencies
        run: npm ci --prefix macrdp-ui
      - name: Test shared engine and desktop application
        run: bash tools/check.sh
      - name: Build and verify release packages
        run: bash macrdp-ui/build.sh
        env:
          MACRDP_CLI_PROFILE: release
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: macrdp-${{ matrix.arch }}
          if-no-files-found: error
          path: |
            macrdp-ui/src-tauri/target/release/bundle/dmg/*.dmg
            macrdp-ui/src-tauri/target/release/bundle/dmg/*.sha256
            macrdp-ui/src-tauri/target/release/bundle/dmg/*.build-info.json
      - name: Name the standalone server for its architecture
        run: cp target/release/macrdp-server target/release/macrdp-server-${{ matrix.arch }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: macrdp-server-${{ matrix.arch }}
          if-no-files-found: error
          path: target/release/macrdp-server-${{ matrix.arch }}

  release:
    needs: build-macos
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: artifacts
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          draft: true
          generate_release_notes: true
          files: |
            artifacts/macrdp-aarch64/*
            artifacts/macrdp-x86_64/*
            artifacts/macrdp-server-aarch64/macrdp-server-aarch64
            artifacts/macrdp-server-x86_64/macrdp-server-x86_64

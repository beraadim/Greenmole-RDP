[workspace]

[patch.crates-io]
ironrdp-server = { path = "../../crates/ironrdp-server-gfx" }
ironrdp-acceptor = { path = "../../crates/ironrdp-acceptor-patched" }

[package]
name = "macrdp-ui"
version = "0.1.10"
edition = "2021"
description = "macrdp GUI — Tauri v2 desktop application"

[build-dependencies]
tauri-build = { version = "=2.5.6", features = [] }

[dependencies]
macrdp-core = { path = "../../crates/macrdp-core" }
tauri = { version = "=2.10.1", features = ["tray-icon", "macos-private-api"] }
# Tauri 2.10.1's runtime traits and menu macros must come from its release set.
# Newer 2.x internals can introduce APIs that this pinned Tauri version lacks.
tauri-runtime = "=2.10.0"
tauri-runtime-wry = { version = "=2.10.0", default-features = false }
tauri-macros = "=2.5.3"
tauri-plugin-single-instance = "2"
tauri-plugin-autostart = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
rusqlite = { version = "0.31", features = ["bundled"] }
chrono = { version = "0.4", features = ["serde"] }
dirs = "6"
toml = "0.8"
tempfile = "3"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSGraphics", "NSScreen", "NSWindow", "NSSavePanel", "NSApplication", "NSPanel"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSArray", "NSDictionary", "NSString", "NSGeometry", "NSValue", "NSURL"] }

[lib]
name = "macrdp_ui"
crate-type = ["lib", "cdylib", "staticlib"]

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 8
strip = false
